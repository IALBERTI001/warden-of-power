<div id="warden-lattice">
<style>
#warden-lattice{--wp-bg:#101b1e;--wp-panel:#17252a;--wp-ink:#efe6d3;--wp-muted:#b2bcb7;--wp-brass:#c7a66d;--wp-line:#41514f;color:var(--wp-ink);font:14px/1.5 'Segoe UI',sans-serif}#warden-lattice *{box-sizing:border-box}#warden-lattice button{font:inherit;color:inherit}#warden-lattice .wp-window{background:var(--wp-bg);border:1px solid #586055;border-radius:14px;overflow:hidden}#warden-lattice header{padding:25px 105px 20px 26px;background:linear-gradient(120deg,#243136,#101b1e);border-bottom:1px solid #45534d}#warden-lattice .wp-eyebrow{font-size:11px;letter-spacing:2px;color:#d0b786;text-transform:uppercase}#warden-lattice h2{font:normal 30px/1.2 Georgia,serif;margin:6px 0 9px}#warden-lattice .wp-headerline{display:flex;gap:16px;align-items:center;flex-wrap:wrap}#warden-lattice .wp-currency{color:#f2d39d;font-size:16px;font-variant-numeric:tabular-nums}#warden-lattice .wp-note{font-size:12px;color:var(--wp-muted)}#warden-lattice .wp-content{display:grid;grid-template-columns:minmax(0,1fr) 260px}#warden-lattice .wp-board{padding:20px 15px 14px;min-width:0;background:radial-gradient(ellipse at 50% 0,#283536 0,transparent 65%)}#warden-lattice .wp-core{display:flex;align-items:center;justify-content:center;gap:11px;margin:0 auto 23px;color:#ddc79b}#warden-lattice .wp-core-seal{display:grid;place-items:center;width:42px;height:42px;background:#263738;border:1px solid #ab925f;transform:rotate(45deg);border-radius:5px}#warden-lattice .wp-core-seal i,#warden-lattice .wp-core-seal svg{transform:rotate(-45deg)}#warden-lattice .wp-branches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative}#warden-lattice .wp-branches:before{content:'';position:absolute;left:10%;right:10%;top:0;height:1px;background:#67715d}#warden-lattice .wp-branch{min-width:0;text-align:center;position:relative;padding-top:12px}#warden-lattice .wp-branch:before{content:'';height:12px;width:1px;position:absolute;top:0;left:50%;background:#67715d}#warden-lattice .wp-branch h3{font-size:13px;font-weight:500;margin:3px 0 0;color:var(--wp-ink)}#warden-lattice .wp-branch .wp-purpose{font-size:11px;color:var(--wp-muted);margin:0 0 16px;min-height:18px}#warden-lattice .wp-node{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;position:relative;padding:12px 2px 10px;width:100%;min-height:115px;border-radius:8px;text-align:center}#warden-lattice .wp-node+.wp-node:before{content:'';height:19px;width:1px;position:absolute;left:50%;top:-11px;background:var(--wp-line)}#warden-lattice .wp-node.wp-open:before{background:#b09b70}#warden-lattice .wp-gem{width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(145deg,#344346,#18252a);border:1px solid #6b736b;border-radius:9px;box-shadow:inset 0 0 0 3px #172326;color:var(--element);position:relative;margin-bottom:9px}#warden-lattice .wp-node.wp-owned .wp-gem{background:color-mix(in srgb,var(--element) 14%,#172326);border-color:#b5a178}#warden-lattice .wp-node[aria-pressed=true]{background:#253536}#warden-lattice .wp-node[aria-pressed=true] .wp-gem{outline:2px solid #e4c58b;outline-offset:3px}#warden-lattice .wp-node.wp-sealed .wp-gem{color:#9aa6a4;background:#1b292d}#warden-lattice .wp-node-name{font-size:12px;line-height:1.3;max-width:100%;overflow-wrap:anywhere}#warden-lattice .wp-rank{font-size:11px;color:var(--wp-muted);margin-top:3px;font-variant-numeric:tabular-nums}#warden-lattice .wp-node:hover{background:#223236}#warden-lattice .wp-detail{background:#1b2a2d;padding:22px 19px;border-left:1px solid #46534c;min-width:0}#warden-lattice .wp-detail h3{font:normal 25px/1.2 Georgia,serif;margin:12px 0}#warden-lattice .wp-detail p{margin:12px 0;color:#c5cdc4}#warden-lattice .wp-detail .wp-detail-icon{display:grid;place-items:center;border:1px solid #9c8c6c;width:55px;height:55px;border-radius:12px;background:#243638;color:var(--selected-color)}#warden-lattice .wp-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}#warden-lattice .wp-stat{background:#111e22;padding:12px 10px;border-radius:6px}#warden-lattice .wp-stat span{display:block;font-size:11px;color:var(--wp-muted)}#warden-lattice .wp-stat strong{font-size:19px;font-weight:500;color:#f2dfb9;font-variant-numeric:tabular-nums}#warden-lattice .wp-action{border:1px solid #bfa16e;border-radius:6px;background:#d4b77f;color:#182326;padding:11px 14px;width:100%;font-weight:500;margin:12px 0}#warden-lattice .wp-action:disabled{background:#2a393a;color:#b2bcb7;border-color:#4e5e58}#warden-lattice .wp-secondary{background:transparent;border:1px solid #647065;border-radius:6px;padding:8px 12px;font-size:12px}#warden-lattice .wp-detail hr{border:0;border-top:1px solid #40504a;margin:20px 0}#warden-lattice .wp-foot{padding:13px 22px;border-top:1px solid #45534d;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;color:var(--wp-muted);font-size:12px}#warden-lattice .wp-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 18px}#warden-lattice .wp-tab{background:#17252a;border:1px solid #52635b;border-radius:6px;padding:9px 12px}#warden-lattice .wp-tab[aria-pressed=true]{background:#dac18e;color:#172327;border-color:#dac18e}#warden-lattice .wp-focused{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 5px 20px}#warden-lattice .wp-focused .wp-node{background:#1b2a2d;border:1px solid #45564e;min-height:195px;padding:22px 12px}#warden-lattice .wp-focused .wp-node[aria-pressed=true]{background:#293b3b;border-color:#c4aa76}#warden-lattice .wp-focused .wp-node+.wp-node:before{display:none}#warden-lattice .wp-focused .wp-node-name{font-size:15px}#warden-lattice .wp-focused .wp-effect-hint{font-size:12px;color:#b8c7bd;margin-top:10px}#warden-lattice .wp-legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--wp-muted);padding:15px 0 0}#warden-lattice .wp-message{min-height:43px;font-size:12px;color:#e1cc9f}#warden-lattice svg{width:21px;height:21px}#warden-lattice .wp-compact .wp-node{min-height:103px;padding-top:9px}#warden-lattice [hidden]{display:none!important}@media(max-width:800px){#warden-lattice .wp-content{grid-template-columns:1fr}#warden-lattice .wp-detail{border-left:0;border-top:1px solid #46534c;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}#warden-lattice .wp-detail .wp-overview{grid-row:span 2}#warden-lattice .wp-compare{margin:0 0 12px}#warden-lattice .wp-detail hr{display:none}}@media(max-width:480px){#warden-lattice header{padding-left:18px}#warden-lattice .wp-branches{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 8px}#warden-lattice .wp-branches:before,#warden-lattice .wp-branch:before{display:none}#warden-lattice .wp-branch:last-child{grid-column:1/-1}#warden-lattice .wp-branch:last-child .wp-node{max-width:190px;margin:auto}#warden-lattice .wp-detail{display:block}#warden-lattice .wp-compare{margin:18px 0}#warden-lattice .wp-focused{grid-template-columns:1fr}#warden-lattice h2{font-size:26px}}
</style>
<div class="viz-carousel" aria-label="Skill tree layouts">
<section data-variant="Conduit board" aria-label="Complete elemental skill tree"><div class="wp-window" data-layout="board"></div></section>
<section data-variant="Branch focus" aria-label="Focused elemental branch" hidden><div class="wp-window" data-layout="focus"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('warden-lattice');
const branches=[
{id:'fire',name:'Fire',purpose:'Burn & shatter',color:'#f5a36b',icon:'flame',nodes:[
['Furnace tuning','Burn damage',8,'%',3,'Strengthen damage over time from fire towers.','Burn ticks deal more damage; duration stays unchanged.'],
['Hot pursuit','Direct fire damage',6,'%',3,'Strengthen fire projectile impact damage.','Useful against isolated enemies as well as groups.'],
['Thermal fracture','Shatter damage',10,'%',3,'Increase the burst damage when fire strikes a frozen enemy.','Freeze resistance after shatter stays at 2 seconds.'],
['Blast chamber','Shatter radius',20,'%',1,'Expand the radius of the shatter burst.','Makes tightly packed enemies more vulnerable.'] ]},
{id:'water',name:'Water',purpose:'Coverage & setup',color:'#69d4dc',icon:'droplets',nodes:[
['Deep saturation','Soak duration',10,'%',3,'Keep enemies soaked for longer.','A successful freeze still consumes soaked.'],
['Long reach','Water tower range',4,'%',3,'Extend water tower coverage.','Creates more overlap with ice and lightning towers.'],
['Pressure valve','Water attack speed',5,'%',3,'Apply water attacks more frequently.','Does not bypass freeze recovery or extend a freeze.'],
['Overflow','Extra splash targets',1,' target',1,'Water impacts can soak one additional nearby enemy.','The primary target is unchanged.'] ]},
{id:'ice',name:'Ice',purpose:'Control & precision',color:'#b1e3f0',icon:'snowflake',nodes:[
['Cold front','Chill slow strength',2,' pp',3,'Add percentage points to the normal chilling slow.','Movement slow caps at 50%; full freeze requires soaked.'],
['Brittle targets','Ice damage vs frozen',10,'%',3,'Ice attacks deal more damage against frozen enemies.','Hits do not refresh or extend the freeze timer.'],
['Crystal focus','Ice tower range',4,'%',3,'Extend ice tower coverage.','Helps catch soaked enemies across more of the route.'],
['Cold calculation','Ice damage vs bosses',20,'%',1,'Increase ice tower damage against bosses.','Boss resistance and freeze duration stay unchanged.'] ]},
{id:'lightning',name:'Lightning',purpose:'Chains & crowds',color:'#c4a0ed',icon:'zap',nodes:[
['Live wire','Lightning damage',6,'%',3,'Increase lightning attack damage.','Applies to the first strike and conducted hits.'],
['Close connection','Conduction distance',8,'%',3,'Increase the distance an arc can jump between enemies.','A valid soaked target is still required for conduction.'],
['Conductive force','Conducted hit damage',8,'%',3,'Strengthen secondary hits created by conduction.','This bonus affects chained hits, not the initial strike.'],
['Chain reaction','Extra chain targets',1,' target',1,'Add one target to the maximum chain length.','Arcs only connect valid enemies within jump distance.'] ]},
{id:'engineering',name:'Engineering',purpose:'Economy & setup',color:'#dfbd7e',icon:'settings-2',nodes:[
['Reserve capacity','Starting Charge',20,' Charge',3,'Start an endless attempt with additional Charge.','Resonance and campaign resources are unaffected.'],
['Efficient fittings','Tower upgrade discount',2,'%',3,'Reduce the Charge cost of tower upgrades.','Discount caps at 6%; minimum price is 1 Charge.'],
['Reclamation','Bonus sell refund',5,' pp',3,'Increase the share of spent Charge returned when selling.','Refund caps at 90% of the actual amount paid.'],
['Stable current','Charge per 5 waves',30,' Charge',1,'Receive extra Charge after every fifth completed wave.','No change to Resonance rewards or ladder scoring.'] ]}
];
const nodes=branches.flatMap(b=>b.nodes.map((a,i)=>({id:b.id+i,branch:b,index:i,name:a[0],stat:a[1],step:a[2],unit:a[3],max:a[4],desc:a[5],note:a[6]})));
let ranks={fire0:1,fire1:1,water0:1},selected='fire2',focus='fire',message='Select a node to compare its current and next rank.';
const budget=320;const settings={compact:false};
const get=id=>nodes.find(n=>n.id===id);
function price(n,r){return n.index===3?120:25+n.index*15+r*25}
function rank(n){return ranks[n.id]||0}
function spent(){return nodes.reduce((sum,n)=>sum+Array.from({length:rank(n)},(_,r)=>price(n,r)).reduce((a,b)=>a+b,0),0)}
function eligible(n){return n.index===0||rank(get(n.branch.id+(n.index-1)))>0}
function format(n,r){const val=n.step*r;return (val>0?'+':'')+val+n.unit+(n.unit===' target'&&val!==1?'s':'')}
function hydrate(state){const incoming=state?.privateContent;if(!incoming)return;let next={};for(const n of nodes){const r=incoming.ranks?.[n.id];if(Number.isInteger(r)&&r>=0&&r<=n.max)next[n.id]=r}ranks=next;for(const n of nodes)if(rank(n)&&!eligible(n))delete ranks[n.id];if(spent()>budget)ranks={};if(get(incoming.selected))selected=incoming.selected;if(branches.some(b=>b.id===incoming.focus))focus=incoming.focus;}
hydrate(window.openai?.widgetState);
function remember(){window.openai?.setWidgetState?.({modelContent:{selectedUpgrade:get(selected).name,selectedBranch:focus,allocatedUpgrades:Object.fromEntries(nodes.filter(n=>rank(n)).map(n=>[n.name,rank(n)]))},privateContent:{ranks,selected,focus}})?.catch(()=>{});}
function nodeMarkup(n,full=false){const r=rank(n),open=eligible(n);return `<button type="button" class="wp-node cursor-interaction ${r?'wp-owned':''} ${open?'wp-open':'wp-sealed'}" data-node="${n.id}" aria-pressed="${selected===n.id}" aria-label="${n.branch.name}: ${n.name}, rank ${r} of ${n.max}${open?'':', prerequisite required'}" style="--element:${n.branch.color}"><span class="wp-gem"><i data-lucide="${open?n.branch.icon:'lock-keyhole'}" aria-hidden="true"></i></span><span class="wp-node-name">${n.name}</span><span class="wp-rank">${r?'Rank '+r+'/'+n.max:open?'Available · 0/'+n.max:'Locked · 0/'+n.max}</span>${full?`<span class="wp-effect-hint">${n.stat}<br>${format(n,Math.min(r+1,n.max))}</span>`:''}</button>`}
function render(){
const n=get(selected),r=rank(n),available=budget-spent(),cost=price(n,r),prereq=n.index?get(n.branch.id+(n.index-1)):null;
root.querySelectorAll('[data-layout]').forEach(win=>{
const focused=win.dataset.layout==='focus';
win.classList.toggle('wp-compact',settings.compact);
win.innerHTML=`<header><div class="wp-eyebrow">Warden of Power · Endless mastery</div><h2>Resonance lattice</h2><div class="wp-headerline"><span class="wp-currency">◈ ${available} Resonance</span><span class="wp-note">Endless bonuses only · Demo allocation</span></div></header><div class="wp-content"><div class="wp-board">${focused?`<div class="wp-tabs" aria-label="Element branches">${branches.map(b=>`<button type="button" class="wp-tab cursor-interaction" data-branch="${b.id}" aria-pressed="${focus===b.id}">${b.name}</button>`).join('')}</div><div class="wp-focused">${nodes.filter(v=>v.branch.id===focus).map(v=>nodeMarkup(v,true)).join('')}</div>`:`<div class="wp-core"><span class="wp-core-seal"><i data-lucide="shield" aria-hidden="true"></i></span><span>Warden’s seal<br><span class="wp-note">Five conduits. One defense.</span></span></div><div class="wp-branches">${branches.map(b=>`<section class="wp-branch" aria-label="${b.name} branch"><h3>${b.name}</h3><p class="wp-purpose">${b.purpose}</p>${nodes.filter(v=>v.branch.id===b.id).map(v=>nodeMarkup(v)).join('')}</section>`).join('')}</div>`}<div class="wp-legend"><span>Gold rim · learned</span><span>Open icon · available</span><span>Lock · prerequisite</span></div></div><aside class="wp-detail" aria-label="Selected upgrade" style="--selected-color:${n.branch.color}"><div class="wp-overview"><div class="wp-detail-icon"><i data-lucide="${n.branch.icon}" aria-hidden="true"></i></div><p class="wp-eyebrow">${n.branch.name} · ${n.index===3?'Capstone':'Rank '+r+' of '+n.max}</p><h3>${n.name}</h3><p>${n.desc}</p><p class="wp-note">${n.note}</p></div><div><div class="wp-compare"><div class="wp-stat"><span>Current bonus</span><strong>${format(n,r)}</strong></div><div class="wp-stat"><span>${r===n.max?'Maximum':'Next rank'}</span><strong>${format(n,Math.min(r+1,n.max))}</strong></div></div><p class="wp-note">${n.stat} · additive within this skill</p><hr><p class="wp-note">${prereq?`Requires ${prereq.name} · rank 1 ${eligible(n)?'✓':''}`:'Starting node · no prerequisite'}</p><button type="button" class="wp-action cursor-interaction" data-buy ${r===n.max||!eligible(n)||cost>available?'disabled':''}>${r===n.max?'Fully attuned':!eligible(n)?'Prerequisite required':cost>available?`Need ${cost-available} more Resonance`:`Attune · ${cost} Resonance`}</button><div class="wp-message" role="status" aria-live="polite">${message}</div><p class="wp-note">Unlocks are permanent purchases.<br>Reassign freely between attempts.</p></div></aside></div><footer class="wp-foot"><span>Freeze 1.5s · Thaw recovery 4s · Shatter recovery 2s</span><button type="button" class="wp-secondary cursor-interaction" data-refund>Reassign all · full refund</button><span>Upgrade values proposed for playtesting</span></footer>`;
});
if(globalThis.lucide)lucide.createIcons({attrs:{width:21,height:21}});
}
root.addEventListener('click',e=>{
const button=e.target.closest('button');if(!button||!root.contains(button))return;
if(button.dataset.node){selected=button.dataset.node;focus=get(selected).branch.id;message='Selecting a node never spends Resonance.';}
else if(button.dataset.branch){focus=button.dataset.branch;selected=focus+'0';message='Compare upgrades before committing Resonance.';}
else if(button.hasAttribute('data-buy')){const n=get(selected),r=rank(n),cost=price(n,r);if(r<n.max&&eligible(n)&&cost<=budget-spent()){ranks[n.id]=r+1;message=`${n.name} attuned to rank ${r+1}. ${cost} Resonance spent.`;}}
else if(button.hasAttribute('data-refund')){ranks={};message='All allocated Resonance refunded. Choose a new build.';}
render();remember();
});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){hydrate(e.detail.globals.widgetState);render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(settings,'compact',{label:'Compact node spacing'});}
})();
</script>
</div>
